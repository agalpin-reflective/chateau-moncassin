# Site statique derrière le proxy de Coolify, qui termine le HTTPS : nginx n'écoute qu'en HTTP.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  # Redirections relatives : derrière le proxy, une redirection absolue renverrait vers http et le port interne.
  absolute_redirect off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Fichiers au nom empreinté par le build : cache d'un an, jamais revalidés.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  # Pages : /souscrire sert souscrire/index.html sans redirection. Toujours revalidées, pour qu'un déploiement soit visible aussitôt.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
