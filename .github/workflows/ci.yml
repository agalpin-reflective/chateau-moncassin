name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_STRIPE_LINK_DECOUVERTE: ${{ vars.PUBLIC_STRIPE_LINK_DECOUVERTE }}
          PUBLIC_STRIPE_LINK_DOMAINE: ${{ vars.PUBLIC_STRIPE_LINK_DOMAINE }}
